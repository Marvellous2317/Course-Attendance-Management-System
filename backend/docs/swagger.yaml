schemes:
- http
securityDefinitions:
  BearerAuth:
    description: Enter "Bearer" followed by a space and the access token returned
      by POST /api/login.
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
tags:
- description: Login, registration, token refresh and profile
  name: auth
- description: Role administration
  name: roles
- description: Course administration
  name: courses
- description: Teacher administration
  name: teachers
- description: Student administration
  name: students
