host: localhost:8080
info:
  contact: {}
  description: API for managing roles, courses, teachers, students, course offerings
    and attendance.
  title: Course Attendance Management API
  version: "1.0"
paths:
  /admin/courses:
    get:
      description: Returns paginated courses, newest first. Set isDeleted=true to
        include soft-deleted courses.
      parameters:
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 20
        description: Items per page (max 50)
        in: query
        name: perPage
        type: integer
      - description: Include deleted courses
        in: query
        name: isDeleted
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.CourseListResponse'
        "500":
